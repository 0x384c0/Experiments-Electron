name: deploy_desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute next patch version
        id: next
        run: |
          version=$(node -p "const [a, b, c] = require('./apps/desktop/package.json').version.split('.'); [a, b, +c + 1].join('.')")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --no-workspaces-update -w apps/desktop

      - name: Build installer
        run: npm run package:desktop

      - name: Collect installer files
        shell: bash
        run: |
          mkdir -p dist-installers
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" \) \
            -exec cp {} dist-installers/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: dist-installers/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Commit version bump and tag
        run: |
          npm version "$VERSION" --no-git-tag-version --no-workspaces-update -w apps/desktop
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release desktop v$VERSION"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"

      - name: Create GitHub Release and upload installers
        run: |
          gh release create "v$VERSION" release/*/* \
            --verify-tag \
            --title "Desktop v$VERSION" \
            --notes "Unsigned build. See README for install instructions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
