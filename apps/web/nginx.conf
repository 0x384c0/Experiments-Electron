server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # connect-src: open-meteo.com (weather API) -- add a new origin here and in
  # apps/desktop/src/main/index.ts whenever a feature calls a new external API.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri /index.html;
  }
}
