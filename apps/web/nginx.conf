server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # img-src/connect-src: weatherapi.com (API + forecast icon CDN) -- add the
  # same origin here and in apps/desktop/src/main/index.ts when a feature
  # calls a new API.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.weatherapi.com; connect-src 'self' https://api.weatherapi.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri /index.html;
  }
}
