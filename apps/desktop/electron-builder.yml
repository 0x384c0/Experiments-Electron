appId: com.experiments.electron
productName: ExperimentsElectron
# defaults to a sanitized package.json `name` (@experiments-electron/desktop),
# which breaks the Linux AppImage build (invalid path characters). Set explicitly.
executableName: ExperimentsElectron
directories:
  output: release
files:
  - out/**/*
mac:
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
  category: Utility
